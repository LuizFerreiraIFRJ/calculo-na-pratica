<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cálculo na Prática — Atividades</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--verde:#2f9e41;--verde-esc:#1e6b2a;--vermelho:#c8191e;--fundo:#f6f8f6;--cartao:#ffffff;--texto:#1c2420;--sutil:#5d6a61;--borda:#d9e4db;--certo:#e5f4e8;--errado:#fbe9e9;--dica:#fff6db;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fundo:#111613;--cartao:#1a211c;--texto:#e7ede8;--sutil:#a5b3a8;--borda:#2c3a2f;--verde-esc:#86d493;--certo:#17331d;--errado:#3a1b1c;--dica:#352f19;color-scheme:dark}}
:root[data-theme="dark"]{--fundo:#111613;--cartao:#1a211c;--texto:#e7ede8;--sutil:#a5b3a8;--borda:#2c3a2f;--verde-esc:#86d493;--certo:#17331d;--errado:#3a1b1c;--dica:#352f19;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:17px;line-height:1.5}
.topo{background:var(--verde);color:#fff;padding:12px 16px}
.topo small{display:block;font-size:12px;opacity:.92;letter-spacing:.02em}
.topo b{font-size:19px}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h2{font-size:16px;color:var(--verde-esc);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:14px;margin:10px 0}
button,.btn{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
.ativ{display:block;width:100%;text-align:left;background:var(--cartao);border:1px solid var(--borda);border-left:6px solid var(--verde);color:var(--texto)}
.ativ .t{font-weight:bold;display:block}
.ativ .s{font-size:14px;color:var(--sutil)}
.barra{height:6px;background:var(--borda);border-radius:3px;margin-top:8px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde)}
.bloq{border-left-color:var(--sutil);opacity:.95}
.cod{display:flex;gap:8px;margin-top:10px}
.cod input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--borda);background:var(--fundo);color:var(--texto);text-transform:uppercase}
.cod button{background:var(--verde);color:#fff;font-weight:bold}
.link{background:none;color:var(--verde-esc);padding:4px 0;text-decoration:underline;font-size:15px}
.voltar{background:none;color:var(--verde-esc);padding:6px 0;font-weight:bold}
.enun{font-size:18px}
.op{display:block;width:100%;text-align:left;margin:8px 0;background:var(--cartao);color:var(--texto);border:2px solid var(--borda)}
.op.certa{border-color:var(--verde);background:var(--certo)}
.op.errada{border-color:var(--vermelho);background:var(--errado)}
.op:disabled{cursor:default;color:var(--texto)}
.aviso{font-size:14px;color:var(--sutil)}
.dica{background:var(--dica);border-radius:10px;padding:10px 12px;margin:8px 0}
.fb{font-weight:bold;margin:10px 0 4px}
.fb.ok{color:var(--verde-esc)} .fb.no{color:var(--vermelho)}
.passos{margin:6px 0 0;padding-left:22px}
.passos li{margin:6px 0}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;font-weight:bold}
.prim{background:var(--verde);color:#fff}
.sec{background:var(--cartao);color:var(--verde-esc);border:2px solid var(--verde)}
.m{font-family:"Cambria Math","STIX Two Math","Times New Roman",Times,serif;font-size:1.08em}
.m .tx{font-family:Arial,sans-serif;font-size:.88em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;margin:0 .12em;line-height:1.15}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.68em;line-height:1.05;margin:0 .1em}
.int{font-size:1.4em;vertical-align:middle}
.rad{border-top:1px solid currentColor;padding-top:.05em}
sup,sub{font-size:.72em;line-height:0}
.painel{border:2px dashed var(--verde);background:var(--cartao);border-radius:12px;padding:12px;margin:12px 0}
.painel summary{font-weight:bold;color:var(--verde-esc);cursor:pointer}
.painel label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}
.painel label input{width:22px;height:22px;flex:none}
.painel code{background:var(--fundo);padding:1px 6px;border-radius:5px;font-size:13px}
#qr{display:flex;justify-content:center;margin:12px 0}
#qr img,#qr canvas{background:#fff;padding:10px;border-radius:8px}
.tela-qr{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;color:#1c2420;text-align:center;padding:20px}
.tela-qr b{font-size:28px;color:#1e6b2a}
.rodape{text-align:center;font-size:13px;color:var(--sutil);margin-top:28px}
.campos{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.campos input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--borda);background:var(--fundo);color:var(--texto)}
.ola{margin:4px 0 10px;font-size:15px}
.comprovante{display:flex;flex-direction:column;gap:4px;text-align:center;border:3px solid var(--verde);border-radius:14px;padding:16px;margin:12px 0;background:var(--certo)}
.comprovante small{color:var(--verde-esc);font-weight:bold;letter-spacing:.04em}
.comprovante .n{font-size:22px}
</style></head>
<body>
<div class="topo"><small>IFRJ · Campus Paracambi · Cursos Técnicos</small><b>Cálculo na Prática</b></div>
<main id="app"></main>

to)}\n.ativ .t{font-weight:bold;display:block}\n.ativ .s{font-size:14px;color:var(--sutil)}\n.barra{height:6px;background:var(--borda);border-radius:3px;margin-top:8px;overflow:hidden}\n.barra i{display:block;height:100%;background:var(--verde)}\n.bloq{border-left-color:var(--sutil);opacity:.95}\n.cod{display:flex;gap:8px;margin-top:10px}\n.cod input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--borda);background:var(--fundo);color:var(--texto);text-transform:uppercase}\n.cod button{background:var(--verde);color:#fff;font-weight:bold}\n.link{background:none;color:var(--verde-esc);padding:4px 0;text-decoration:underline;font-size:15px}\n.voltar{background:none;color:var(--verde-esc);padding:6px 0;font-weight:bold}\n.enun{font-size:18px}\n.op{display:block;width:100%;text-align:left;margin:8px 0;background:var(--cartao);color:var(--texto);border:2px solid var(--borda)}\n.op.certa{border-color:var(--verde);background:var(--certo)}\n.op.errada{border-color:var(--vermelho);background:var(--errado)}\n.op:disabled{cursor:default;color:var(--texto)}\n.aviso{font-size:14px;color:var(--sutil)}\n.dica{background:var(--dica);border-radius:10px;padding:10px 12px;margin:8px 0}\n.fb{font-weight:bold;margin:10px 0 4px}\n.fb.ok{color:var(--verde-esc)} .fb.no{color:var(--vermelho)}\n.passos{margin:6px 0 0;padding-left:22px}\n.passos li{margin:6px 0}\n.nav{display:flex;gap:10px;margin-top:16px}\n.nav button{flex:1;font-weight:bold}\n.prim{background:var(--verde);color:#fff}\n.sec{background:var(--cartao);color:var(--verde-esc);border:2px solid var(--verde)}\n.m{font-family:\"Cambria Math\",\"STIX Two Math\",\"Times New Roman\",Times,serif;font-size:1.08em}\n.m .tx{font-family:Arial,sans-serif;font-size:.88em}\n.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;margin:0 .12em;line-height:1.15}\n.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em}\n.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.68em;line-height:1.05;margin:0 .1em}\n.int{font-size:1.4em;vertical-align:middle}\n.rad{border-top:1px solid currentColor;padding-top:.05em}\nsup,sub{font-size:.72em;line-height:0}\n.painel{border:2px dashed var(--verde);background:var(--cartao);border-radius:12px;padding:12px;margin:12px 0}\n.painel summary{font-weight:bold;color:var(--verde-esc);cursor:pointer}\n.painel label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}\n.painel label input{width:22px;height:22px;flex:none}\n.painel code{background:var(--fundo);padding:1px 6px;border-radius:5px;font-size:13px}\n#qr{display:flex;justify-content:center;margin:12px 0}\n#qr img,#qr canvas{background:#fff;padding:10px;border-radius:8px}\n.tela-qr{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;color:#1c2420;text-align:center;padding:20px}\n.tela-qr b{font-size:28px;color:#1e6b2a}\n.rodape{text-align:center;font-size:13px;color:var(--sutil);margin-top:28px}\n.campos{display:flex;flex-direction:column;gap:10px;margin:12px 0}\n.campos input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--borda);background:var(--fundo);color:var(--texto)}\n.ola{margin:4px 0 10px;font-size:15px}\n.comprovante{display:flex;flex-direction:column;gap:4px;text-align:center;border:3px solid var(--verde);border-radius:14px;padding:16px;margin:12px 0;background:var(--certo)}\n.comprovante small{color:var(--verde-esc);font-weight:bold;letter-spacing:.04em}\n.comprovante .n{font-size:22px}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"topo\">\u003csmall>IFRJ · Campus Paracambi · Cursos Técnicos\u003c/small>\u003cb>Cálculo na Prática\u003c/b>\u003c/div>\n\u003cmain id=\"app\">\u003c/main>\n\u003cscript>\nconst ESTADO = __ESTADO__;\nconst MOLDE = __MOLDE__;\nconst ATIV = [{\"id\": \"A1\", \"dia\": 1, \"titulo\": \"Taxa de variação: da média à instantânea\", \"codigo\": \"TAXA\", \"qs\": [{\"id\": \"A1-1\", \"e\": \"Um carro passa pela posição \u003cspan class=\\\"m\\\">s=20 \u003cspan class=\\\"tx\\\">m\u003c\\/span>\u003c\\/span> em \u003cspan class=\\\"m\\\">t=2 \u003cspan class=\\\"tx\\\">s\u003c\\/span>\u003c\\/span> e pela posição \u003cspan class=\\\"m\\\">s=80 \u003cspan class=\\\"tx\\\">m\u003c\\/span>\u003c\\/span> em \u003cspan class=\\\"m\\\">t=5 \u003cspan class=\\\"tx\\\">s\u003c\\/span>\u003c\\/span>. Qual a velocidade média nesse intervalo?\", \"o\": [\"\u003cspan class=\\\"m\\\">60 \u003cspan class=\\\"tx\\\">m/s\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">20 \u003cspan class=\\\"tx\\\">m/s\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">12 \u003cspan class=\\\"tx\\\">m/s\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">16 \u003cspan class=\\\"tx\\\">m/s\u003c\\/span>\u003c\\/span>\"], \"c\": 1, \"d\": \"Velocidade média = variação da posição dividida pela variação do tempo.\", \"r\": [\"\u003cspan class=\\\"m\\\">v\u003csub>m\u003c\\/sub>=\u003cspan class=\\\"fr\\\">\u003cspan>Δ s\u003c\\/span>\u003cspan>Δ t\u003c\\/span>\u003c\\/span>=\u003cspan class=\\\"fr\\\">\u003cspan>80−20\u003c\\/span>\u003cspan>5−2\u003c\\/span>\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">v\u003csub>m\u003c\\/sub>=\u003cspan class=\\\"fr\\\">\u003cspan>60\u003c\\/span>\u003cspan>3\u003c\\/span>\u003c\\/span>=20 \u003cspan class=\\\"tx\\\">m/s\u003c\\/span>\u003c\\/span>\"]}, {\"id\": \"A1-2\", \"e\": \"A posição de um objeto é \u003cspan class=\\\"m\\\">s(t)=t\u003csup>2\u003c\\/sup>\u003c\\/span> (em metros, com \u003cspan class=\\\"m\\\">t\u003c\\/span> em segundos). Qual a velocidade média entre \u003cspan class=\\\"m\\\">t=1 \u003cspan class=\\\"tx\\\">s\u003c\\/span>\u003c\\/span> e \u003cspan class=\\\"m\\\">t=3 \u003cspan class=\\\"tx\\\">s\u003c\\/span>\u003c\\/span>?\", \"o\": [\"\u003cspan class=\\\"m\\\">9 \u003cspan class=\ \u003cspan class=\\\"m\\\">50 \u003cspan class=\\\"tx\\\">V\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">12,5 \u003cspan class=\\\"tx\\\">V\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">25 \u003cspan class=\\\"tx\\\">V\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">0,05 \u003cspan class=\\\"tx\\\">V\u003c\\/span>\u003c\\/span>\"], \"c\": 2, \"d\": \"Primeiro a carga (integral), depois a tensão (divisão por C).\", \"r\": [\"\u003cspan class=\\\"m\\\">q=\u003cspan class=\\\"int\\\">∫\u003c\\/span>\u003cspan class=\\\"ss\\\">\u003cspan>5\u003c\\/span>\u003cspan>0\u003c\\/span>\u003c\\/span>0,004t dt=[0,002t\u003csup>2\u003c\\/sup>]\u003cspan class=\\\"ss\\\">\u003cspan>5\u003c\\/span>\u003cspan>0\u003c\\/span>\u003c\\/span>=0,05 \u003cspan class=\\\"tx\\\">C\u003c\\/span>\u003c\\/span>\", \"\u003cspan class=\\\"m\\\">V=\u003cspan class=\\\"fr\\\">\u003cspan>q\u003c\\/span>\u003cspan>C\u003c\\/span>\u003c\\/span>=\u003cspan class=\\\"fr\\\">\u003cspan>0,05\u003c\\/span>\u003cspan>0,002\u003c\\/span>\u003c\\/span>=25 \u003cspan class=\\\"tx\\\">V\u003c\\/span>\u003c\\/span>\"]}]}];\nconst TK_E = \"__EST\" + \"ADO__\", TK_M = \"__MOL\" + \"DE__\";\nconst CHAVE = \"calculo-ifrj-paracambi-v1\";\nconst SITE = !(window.claude && window.claude.use);   // aberto como site comum (GitHub Pages), fora do Claude\nconst app = document.getElementById(\"app\");\nlet local = carregar(), tela = { nome: \"inicio\" }, professor = false, mostrarDica = false;\n\nfunction carregar() { try { const v = JSON.parse(localStorage.getItem(CHAVE)); if (v && v.cod && v.resp) return v; } catch (e) {} return { cod: {}, resp: {}, nome: \"\" }; }\nfunction limpaNome(s) { return (s || \"\").replace(/\\s+/g, \" \").trim(); }\nfunction entrar() {\n  tela = { nome: \"entrar\" };\n  app.innerHTML = \"\";\n  const c = el('\u003cdiv class=\"cartao\">\u003ch2 style=\"margin-top:0\">Entrar\u003c/h2>\u003cp>Digite seu nome e sobrenome. Eles ficam só neste celular e aparece nf) { local = { cod: {}, resp: {}, nome: \"\" }; salvar(); entrar(); return; }\n      b.dataset.conf = \"1\"; b.textContent = \"toque de novo para sair (apaga as respostas deste celular)\";\n    };\n    app.appendChild(s);\n  }\n  app.appendChild(el('\u003cp class=\"aviso\">Resolva cada questão \u003cb>no papel primeiro\u003c/b> e só depois marque a resposta. As atividades são liberadas pelo professor ao longo da aula.\u003c/p>'));\n  [1, 2].forEach(dia => {\n    app.appendChild(el(`\u003ch2>Dia ${dia} — ${dia === 1 ? \"Derivadas\" : \"Integrais\"}\u003c/h2>`));\n    ATIV.forEach((a, i) => {\n      if (a.dia !== dia) return;\n      const p = progresso(i);\n      if (liberada(i)) {\n        const b = el(`\u003cbutton class=\"ativ\">\u003cspan class=\"t\">${a.id} · ${a.titulo}\u003c/span>\u003cspan class=\"s\">${p.feitas} de ${p.total} feitas · ${p.certas} certas\u003c/span>\u003cdiv class=\"barra\">\u003ci style=\"width:${100 * p.feitas / p.total}%\">\u003c/i>\u003c/div>\u003c/button>`);\n        b.onclick = () => abrir(i, primeiraPendente(i));\n        app.appendChild(b);\n      } else {\n        const c = el(`\u003cdiv class=\"cartao ativ bloq\">\u003cspan class=\"t\">${a.id} · ${a.titulo}\u003c/span>\u003cspan class=\"s\">🔒 Aguarde o professor liberar.\u003c/span>\u003cdiv>\u003cbutton class=\"link\">Tenho um código\u003c/button>\u003c/div>\u003c/div>`);\n        c.querySelector(\".link\").onclick = ev => {\n          const f = el('\u003cdiv class=\"cod\">\u003cinput placeholder=\"Código\" autocomplete=\"off\" autocapitalize=\"characters\">\u003cbutton>Liberar\u003c/button>\u003c/div>');\n          ev.target.replaceWith(f);\n          const inp = f.querySelector(\"input\"); inp.focus();\n          const tentar = () => {\n            if (normaliza(inp.value) === normaliza(a.codigo)) { local.cod[a.id] = true; salvar(); inicio(); }\n            else { inp.value = \"\"; inp.placeholder = \"Código incorreto\"; }\n          };\n          f.querySelector(\"button\").onclick = tentar;\n          inp.onkeydown = e => { if (e.key === \"Enter\") tentar(); };\n        };\n        app.appendChild(c);\n      }\n    });\n  });\n  app.appendChild(el('\u003cp class=\"rodape\">Não apareceu a atividade liberada? Atualize a página.\u003cbr>Prof. Luiz Ferreira · IFRJ Campus Paracambi\u003c/p>'));\n}\nfunction primeiraPendente(i) { const k = ATIV[i].qs.findIndex(q => !local.resp[q.id]); return k \u003c 0 ? 0 : k; }\n\nfunction abrir(i, j) {\n  tela = { nome: \"questao\", i, j }; mostrarDica = false;\n  const a = ATIV[i], q = a.qs[j], r = local.resp[q.id];\n  app.innerHTML = \"\";\n  const v = el('\u003cbutton class=\"voltar\">← Atividades\u003c/button>'); v.onclick = inicio; app.appendChild(v);\n  app.appendChild(el(`\u003cp class=\"aviso\">${a.id} · Questão ${j + 1} de ${a.qs.length}\u003c/p>`));\n  const c = el(`\u003cdiv class=\"cartao\">\u003cdiv class=\"enun\">${q.e}\u003c/div>\u003c/div>`);\n  app.appendChild(c);\n  if (!r) c.appendChild(el('\u003cp class=\"aviso\">Faça a conta no papel e depois escolha:\u003c/p>'));\n  q.o.forEach((txt, k) => {\n    const b = el(`\u003cbutton class=\"op\">${String.fromCharCode(97 + k)}) ${txt}\u003c/button>`);\n    if (r) { b.disabled = true; if (k === q.c) b.classList.add(\"certa\"); else if (k === r.e) b.classList.add(\"errada\"); }\n    else b.onclick = () => { local.resp[q.id] = { e: k, ok: k === q.c }; salvar(); abrir(i, j); };\n    c.appendChild(b);\n  });\n  if (!r) {\n    const bd = el('\u003cbutton class=\"link\">💡 Ver dica\u003c/button>');\n    bd.onclick = () => { bd.replaceWith(el(`\u003cdiv class=\"dica\">💡 ${q.d}\u003c/div>`)); };\n    c.appendChild(bd);\n  } else {\n    c.appendChild(el(r.ok ? '\u003cp class=\"fb ok\">✔ Correto!\u003c/p>' : '\u003cp class=\"fb no\">✘ Não foi dessa vez. A resposta certa está marcada em verde.\u003c/p>'));\n    c.appendChild(el(`\u003cdiv>\u003cb>Passo a passo\u003c/b>\u003col class=\"passos\">${q.r.map(p => `\u003cli>${p}\u003c/li>`).join(\"\")}\u003c/ol>\u003c/div>`));\n  }\n  const nav = el('\u003cdiv class=\"nav\">\u003c/div>');\n  if (j > 0) { const b = el('\u003cbutton class=\"sec\">Anterior\u003c/button>'); b.onclick = () => abrir(i, j - 1); nav.appendChild(b); }\n  if (j \u003c a.qs.length - 1) { const b = el('\u003cbutton class=\"prim\">Próxima\u003c/button>'); b.onclick = () => abrir(i, j + 1); nav.appendChild(b); }\n  else { const b = el('\u003cbutton class=\"prim\">Concluir\u003c/button>'); b.onclick = () => resumo(i); nav.appendChild(b); }\n  app.appendChild(nav);\n  window.scrollTo(0, 0);\n}\nfunction resumo(i) {\n  const a = ATIV[i], p = progresso(i);\n  app.innerHTML = \"\";\n  app.appendChild(el(`\u003cdiv class=\"cartao\">\u003ch2 style=\"margin-top:0\">${a.id} concluída\u003c/h2>\u003cp>Você respondeu \u003cb>${p.feitas} de ${p.total}\u003c/b> questões e acertou \u003cb>${p.certas}\u003c/b>.\u003c/p>\u003cp class=\"aviso\">Errou alguma? Abra de novo e leia o passo a passo: o erro também ensina.\u003c/p>\u003c/div>`));\n  const cp = el(`\u003cdiv class=\"comprovante\">\u003csmall>COMPROVANTE · Cálculo na Prática · IFRJ Paracambi\u003c/small>\u003cb class=\"n\">\u003c/b>\u003cspan>${a.id} · ${a.titulo}\u003c/span>\u003cspan>\u003cb>${p.certas}\u003c/b> de ${p.total} certas · ${new Date().toLocaleString(\"pt-BR\")}\u003c/span>\u003c/div>`);\n  cp.querySelector(\".n\").textContent = local.nome || \"(sem nome)\";\n  app.appendChild(cp);\n  app.appendChild(el('\u003cp class=\"aviso\" style=\"text-align:center\">Se o professor pedir, tire um print desta tela.\u003c/p>'));\n  const b = el('\u003cbutton class=\"prim\" style=\"width:100%\">Voltar às atividades\u003c/button>'); b.onclick = inicio; app.appendChild(b);\n  window.scrollTo(0, 0);\n}\n\n/* ---------- Painel do professor (só para quem pode editar este app) ---------- */\nfunction jsstr(s) { return JSON.stringify(s).replace(/\u003c/g, \"\\\\u003c\").replace(/\\u2028/g, \"\\\\u2028\").replace(/\\u2029/g, \"\\\\u2029\"); }\nfunction painel() {\n  const p function carregar() { try { const v = JSON.parse(localStorage.getItem(CHAVE)); if (v && v.cod && v.resp) return v; } catch (e) {} return { cod: {}, resp: {}, nome: "" }; }

  nm.focus();
}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(local)); } catch (e) {} }
function liberada(i) { return !!(ESTADO.liberadas && ESTADO.liberadas[i]) || !!local.cod[ATIV[i].id]; }
function normaliza(s) { return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase(); }
function progresso(i) {
  const a = ATIV[i]; let feitas = 0, certas = 0;
  a.qs.forEach(q => { const r = local.resp[q.id]; if (r) { feitas++; if (r.ok) certas++; } });
  return { feitas, certas, total: a.qs.length };

function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

function inicio() {

function primeiraPendente(i) { const k = ATIV[i].qs.findIndex(q => !local.resp[q.id]); return k < 0 ? 0 : k; }

function abrir(i, j) {

  }
  const nav = el('<div class="nav"></div>');
  if (j > 0) { const b = el('<button class="sec">Anterior</button>'); b.onclick = () => abrir(i, j - 1); nav.appendChild(b); }
  if (j < a.qs.length - 1) { const b = el('<button class="prim">Próxima</button>'); b.onclick = () => abrir(i, j + 1); nav.appendChild(b); }
  else { const b = el('<button class="prim">Concluir</button>'); b.onclick = () => resumo(i); nav.appendChild(b); }
  app.appendChild(nav);
  window.scrollTo(0, 0);
}
function resumo(i) {
  const a = ATIV[i], p = progresso(i);
  app.innerHTML = "";
  app.appendChild(el(`<div class="cartao"><h2 style="margin-top:0">${a.id} concluída</h2><p>Você respondeu <b>${p.feitas} de ${p.total}</b> questões e acertou <b>${p.certas}</b>.</p><p class="aviso">Errou alguma? Abra de novo e leia o passo a passo: o erro também ensina.</p></div>`));
  const cp = el(`<div class="comprovante"><small>COMPROVANTE · Cálculo na Prática · IFRJ Paracambi</small><b class="n"></b><span>${a.id} · ${a.titulo}</span><span><b>${p.certas}</b> de ${p.total} certas · ${new Date().toLocaleString("pt-BR")}</span></div>`);
  cp.querySelector(".n").textContent = local.nome || "(sem nome)";
  app.appendChild(cp);
  app.appendChild(el('<p class="aviso" style="text-align:center">Se o professor pedir, tire um print desta tela.</p>'));
  const b = el('<button class="prim" style="width:100%">Voltar às atividades</button>'); b.onclick = inicio; app.appendChild(b);
  window.scrollTo(0, 0);
}

/* ---------- Painel do professor (só para quem pode editar este app) ---------- */
function jsstr(s) { return JSON.stringify(s).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029"); }
function painel() {
  const p = el('<details class="painel" open><summary>Painel do professor</summary><p class="aviso">Marque as atividades que a turma pode abrir e toque em <b>Atualizar a turma</b>. Os códigos servem de plano B: escreva no quadro e o aluno digita no celular.</p><div class="lista"></div><button class="prim" style="width:100%;margin-top:10px" id="pub">Atualizar a turma</button><p class="aviso" id="msg"></p><h2>QR code para os alunos</h2><div class="cod"><input id="url" placeholder="Link de compartilhamento do app"></div><div id="qr"></div><button class="sec" style="width:100%" id="projetar">Projetar QR code em tela cheia</button></details>');
  const lista = p.querySelector(".lista");
  ATIV.forEach((a, i) => {
    const l = el(`<label><input type="checkbox"${ESTADO.liberadas[i] ? " checked" : ""}><span>${a.id} · ${a.titulo}<br><span class="aviso">código: <code>${a.codigo}</code></span></span></label>`);
    lista.appendChild(l);
  });
  const url = p.querySelector("#url"); url.value = SITE ? (location.origin + location.pathname) : (ESTADO.url || "");
  if (SITE) {
    lista.querySelectorAll("input").forEach(x => { x.disabled = true; });
    p.querySelector("#pub").remove();
    p.querySelector(".aviso").innerHTML = "Neste site, a liberação é feita editando o arquivo <b>liberacao.json</b> no GitHub (troque <b>não</b> por <b>sim</b>); os celulares atualizam sozinhos em 1 a 2 minutos. Os códigos continuam valendo como plano B.";
  }
  const desenhaQR = () => {
    const alvo = p.querySelector("#qr"); alvo.innerHTML = "";
    if (url.value && window.QRCode) new QRCode(alvo, { text: url.value, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  };
  url.oninput = desenhaQR; setTimeout(desenhaQR, 0);
  p.querySelector("#projetar").onclick = () => {
    if (!url.value || !window.QRCode) return;
    const t = el('<div class="tela-qr"><b>Cálculo na Prática</b><div class="q"></div><span>Aponte a câmera do celular · toque para fechar</span></div>');
    const lado = Math.floor(Math.min(innerWidth, innerHeight) * 0.7);
    new QRCode(t.querySelector(".q"), { text: url.value, width: lado, height: lado, correctLevel: QRCode.CorrectLevel.M });
    t.onclick = () => t.remove(); document.body.appendChild(t);
  };
  (p.querySelector("#pub") || {}).onclick = async ev => {
    const msg = p.querySelector("#msg"), btn = ev.target;
    const novo = { liberadas: [...lista.querySelectorAll("input")].map(x => x.checked), url: url.value.trim() };
    const html = MOLDE.replace(TK_E, () => JSON.stringify(novo)).replace(TK_M, () => jsstr(MOLDE));
    btn.disabled = true; msg.textContent = "Publicando…";
    try {
      const art = await claude.use("artifact");
      if (!art) throw { code: "unavailable" };
      await art.publish(html);
      msg.textContent = "Pronto! A turma já vê as atividades liberadas.";
    } catch (e) {
      const c = e && e.code;
      if (c === "conflict") msg.textContent = "Havia uma versão mais nova; a página vai recarregar. Confira as marcações e atualize de novo.";
      else if (c === "not_writer" || c === "not_granted" || c === "not_declared") { msg.textContent = "Esta visualização não pode alterar o app. Abra-o pela sua conta no Claude."; }
      else if (c === "rate_limited") msg.textContent = "Muitas atualizações seguidas. Aguarde alguns segundos e tente de novo.";
      else msg.textContent = "Não foi possível atualizar agora. Use os códigos no quadro como plano B.";
    } finally { btn.disabled = false; }
  };
  return p;
}

async function buscaLiberacao() {
  try {
    const r = await fetch("liberacao.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const novas = ATIV.map(a => /^s/i.test(normaliza(String(j[a.id] || ""))));
    const mudou = JSON.stringify(novas) !== JSON.stringify(ESTADO.liberadas);
    ESTADO.liberadas = novas;
    if (mudou && tela.nome === "inicio") inicio();
  } catch (e) {}
}
if (SITE) {
  if (location.hash === "#professor") professor = true;
  buscaLiberacao(); setInterval(buscaLiberacao, 30000);
}
inicio();
if (!SITE) {
  window.claude.use("user").then(async u => {
    let pode = false;
    try { pode = !!(u && await Promise.resolve(u.canEdit())); } catch (e) {}
    if (pode || location.hash === "#professor") { professor = true; if (tela.nome === "inicio" || tela.nome === "entrar") inicio(); }
  }).catch(() => {});
}
</script>
</body></html>
